# AgSync lab: a 3-replica Always On AG (CLUSTER_TYPE = NONE) plus a controller instance outside the AG.
# Started by lab/New-AgLab.ps1, which sets SA_PASSWORD in the environment. Do not run on its own.
name: aglab

x-sql: &sql
  image: mcr.microsoft.com/mssql/server:2022-latest
  environment: &sqlenv
    ACCEPT_EULA: "Y"
    MSSQL_PID: "Developer"
    MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    MSSQL_AGENT_ENABLED: "true"
    MSSQL_ENABLE_HADR: "1"
    MSSQL_MEMORY_LIMIT_MB: "2048"       # four instances share one machine (a CI runner has 16 GB)
  networks: [agnet]
  restart: unless-stopped

services:
  agsql1:
    <<: *sql
    hostname: agsql1
    container_name: agsql1
    ports: ["14341:1433"]
    volumes: ["agsql1data:/var/opt/mssql"]
  agsql2:
    <<: *sql
    hostname: agsql2
    container_name: agsql2
    ports: ["14342:1433"]
    volumes: ["agsql2data:/var/opt/mssql"]
  agsql3:
    <<: *sql
    hostname: agsql3
    container_name: agsql3
    ports: ["14343:1433"]
    volumes: ["agsql3data:/var/opt/mssql"]

  # Controller: holds the AgSync control DB. Deliberately NOT an AG replica,
  # so sync history and pending alerts survive a failover.
  agctl:
    <<: *sql
    hostname: agctl
    container_name: agctl
    environment:
      <<: *sqlenv
      MSSQL_AGENT_ENABLED: "false"
      MSSQL_ENABLE_HADR: "0"
      MSSQL_MEMORY_LIMIT_MB: "1024"
    ports: ["14340:1433"]
    volumes: ["agctldata:/var/opt/mssql"]

networks:
  agnet:

volumes:
  agsql1data:
  agsql2data:
  agsql3data:
  agctldata:
