# Always On Command Center CI: on every push, build a real 3-replica Always On AG in Docker and run the integration suite.
# No secrets needed: every run generates throwaway passwords for a lab that exists only for that run.
name: Integration tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    # Every combination runs in parallel on its own fresh machine
    name: ${{ matrix.os }} / SQL Server ${{ matrix.sql }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25                # job-level backstop only; the build step has its own, shorter limit
    # Known issue (bisected in CI): the SQL Server 2022 CU27 container (2022-latest; build 16.0.4305.5 when tested)
    # spins at 100% CPU on incoming HADR endpoint handshakes on GitHub-hosted runners, so replicas never join.
    # CU17-CU26 and SQL Server 2025 pass on the same runners, and CU27 passes on an Intel desktop.
    # The experimental job stays visible in every run but doesn't turn the badge red.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false              # let every combination finish, so the results can be compared
      matrix:
        include:
          # Required: these decide the badge
          - { os: ubuntu-24.04, sql: '2025-latest',            experimental: false }
          - { os: ubuntu-22.04, sql: '2025-latest',            experimental: false }
          - { os: ubuntu-24.04, sql: '2022-CU26-ubuntu-22.04', experimental: false }   # last 2022 update known good on runners
          # Experimental: tracks the known issue
          - { os: ubuntu-24.04, sql: '2022-latest',            experimental: true }
    env:
      MSSQL_IMAGE_TAG: ${{ matrix.sql }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module dbatools -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Get-Module dbatools, Pester -ListAvailable | Select-Object Name, Version | Format-Table

      - name: Build the AG lab and run the tests
        shell: pwsh
        # A step timeout FAILS the step, which continue-on-error covers for experimental jobs.
        # (A job timeout CANCELS the whole run instead, and a cancelled run shows on the badge.)
        timeout-minutes: 15
        run: |
          # Throwaway credentials for this run only (upper, lower, digit and symbol: meets SQL Server policy)
          function New-LabCredential([string] $User) {
              $pw = 'Lab_9' + [guid]::NewGuid().ToString('N').Substring(0, 16) + '!'
              [pscredential]::new($User, (ConvertTo-SecureString $pw -AsPlainText -Force))
          }
          $sa      = New-LabCredential 'sa'
          $app     = New-LabCredential 'agsync_apply'
          $det     = New-LabCredential 'agsync_detect'
          $ctlCred = New-LabCredential 'agsync_control'

          $lab = ./lab/New-AgLab.ps1 -SaCredential $sa -ApplyCredential $app -DetectCredential $det -ControlCredential $ctlCred -Reset

          $container = New-PesterContainer -Path ./tests/AgSync.Tests.ps1 -Data @{
              Replica = $lab.Replica; AgName = $lab.AgName; ControlInstance = $lab.ControlInstance
              AdminCredential = $sa; ApplyCredential = $app; DetectCredential = $det; ControlCredential = $ctlCred }

          $cfg = New-PesterConfiguration
          $cfg.Run.Container          = $container
          $cfg.Run.Exit               = $true          # non-zero exit code when any test fails: the build goes red
          $cfg.Output.Verbosity       = 'Detailed'
          $cfg.TestResult.Enabled     = $true
          $cfg.TestResult.OutputPath  = 'testResults.xml'
          Invoke-Pester -Configuration $cfg

      - name: AG diagnostics (on failure)
        if: failure()
        shell: pwsh
        run: |
          foreach ($c in 'agsql1', 'agsql2', 'agsql3') {
              Write-Host "`n===== $c : Always On / endpoint / connection messages =====" -ForegroundColor Cyan
              docker logs $c 2>&1 |
                  Select-String -Pattern 'Always On|HADR|availability (group|replica)|endpoint|mirroring|5022|certificate|handshake|47106|3520\d|timeout|error' |
                  Select-Object -Last 40 | ForEach-Object { $l = $_.Line; if ($l.Length -gt 300) { $l.Substring(0, 300) + ' ...' } else { $l } }
          }
          Write-Host "`n===== Container resource use =====" -ForegroundColor Cyan
          docker stats --no-stream
          Write-Host "`n===== Host =====" -ForegroundColor Cyan
          nproc; free -m; uname -r
          lscpu | Select-String 'Model name|Vendor ID|Flags' | ForEach-Object { $l = $_.Line; if ($l.Length -gt 300) { $l.Substring(0, 300) + ' ...' } else { $l } }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.os }}-sql${{ matrix.sql }}
          path: testResults.xml
